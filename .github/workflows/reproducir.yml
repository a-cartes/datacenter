name: Reconstrucción completa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Instalar versiones declaradas
        run: python -m pip install -r requirements-lock.txt
      - name: Reconstruir y verificar CSV y Excel
        run: python scripts/reproducir.py --con-excel
      - name: Conservar evidencia de esta ejecución
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-reconstruccion
          path: |
            artifacts/registro_reproduccion.json
            artifacts/verificacion_contrato.json
            artifacts/verificacion_exportacion_excel_csv.json
          if-no-files-found: warn
          retention-days: 14
