name: Reproducción SOCHER RM
on:
  push:
    branches: [main]
    paths: ['SOCHER_2026_RM/**', '.github/workflows/socher-rm.yml']
  pull_request:
    paths: ['SOCHER_2026_RM/**', '.github/workflows/socher-rm.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproducir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: SOCHER_2026_RM/requirements-lock.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Instalar dependencias
        run: |
          python -m pip install -r SOCHER_2026_RM/requirements-lock.txt
          Rscript SOCHER_2026_RM/scripts/instalar_R.R
      - name: Reconstruir muestras y resultados
        run: python SOCHER_2026_RM/scripts/reproducir.py
      - name: Conservar verificación y resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: socher-rm-reproduccion
          path: |
            SOCHER_2026_RM/salidas/reproduccion/*.json
            SOCHER_2026_RM/salidas/reproduccion/*.csv
            SOCHER_2026_RM/salidas/reproduccion/*.png
            SOCHER_2026_RM/salidas/reproduccion/*.log
            SOCHER_2026_RM/salidas/reproduccion/trabajo/datos/analitico/*.csv
            SOCHER_2026_RM/salidas/reproduccion/trabajo/resultados/emparejamiento*.json
            SOCHER_2026_RM/salidas/reproduccion/trabajo/resultados/socher_20261005/*.csv
          if-no-files-found: warn
          retention-days: 90
