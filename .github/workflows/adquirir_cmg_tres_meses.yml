name: Adquisición CEN de tres meses pendientes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adquirir:
    name: CMg DEF ${{ matrix.mes }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        mes: ['2025-10', '2026-01', '2026-02']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Instalar las versiones declaradas
        run: python -m pip install -r requirements-lock.txt
      - name: Descargar y extraer únicamente el mes asignado
        run: python SOCHER_2026_v7_2020_2026/moderno/scripts/descargar_extraer_moderno.py --months '${{ matrix.mes }}' --phase all --workers 1
      - name: Preservar fuente y resultados de este mes
        uses: actions/upload-artifact@v7
        with:
          name: cmg-DEF-${{ matrix.mes }}
          path: |
            SOCHER_2026_v7_2020_2026/moderno/fuentes/tsv_originales/*.gz
            SOCHER_2026_v7_2020_2026/moderno/fuentes/metadatos/*.json
            SOCHER_2026_v7_2020_2026/moderno/datos/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
