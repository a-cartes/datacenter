<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Centros de datos y costos marginales</title>
  <desc id="desc">Panel eléctrico para Chile. Base observada, identificación causal en validación. Esquema decorativo de conexiones; no representa la red real.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0C2237"/><stop offset="1" stop-color="#153D49"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#55D6C3"/><stop offset="1" stop-color="#69A6EC"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect x="52" y="53" width="5" height="24" rx="2" fill="#55D6C3"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="73" y="72" font-size="17" fill="#A8CDC9" letter-spacing="2.4">CHILE / INVESTIGACIÓN REGIONAL</text>
    <text x="52" y="153" font-size="55" font-weight="700" fill="#FFFFFF">Centros de datos</text>
    <text x="52" y="219" font-size="55" font-weight="700" fill="#FFFFFF">y costos marginales</text>
    <text x="54" y="264" font-size="22" fill="#BDD0DF">Evidencia por barra y hora. Fuentes, método y trazabilidad.</text>
    <line x1="54" y1="305" x2="721" y2="305" stroke="#51717E" stroke-opacity=".6"/>
    <text x="54" y="343" font-size="15" letter-spacing="1.6" fill="#55D6C3">BASE OBSERVADA DISPONIBLE</text>
    <text x="54" y="371" font-size="17" fill="#BDD0DF">Identificación causal en validación</text>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="2.5" opacity=".75">
    <path d="M831 316 L902 232 L868 128 L1008 87 L1080 197 L1189 131"/>
    <path d="M902 232 L1080 197 L1158 319 L1027 339 L902 232"/>
    <path d="M868 128 L1080 197 M1008 87 L1027 339 M831 316 L1027 339" stroke-opacity=".35"/>
  </g>
  <g stroke="#0F293D" stroke-width="5">
    <circle cx="831" cy="316" r="10" fill="#62A8E1"/><circle cx="902" cy="232" r="17" fill="#55D6C3"/>
    <circle cx="868" cy="128" r="12" fill="#62A8E1"/><circle cx="1008" cy="87" r="14" fill="#55D6C3"/>
    <circle cx="1080" cy="197" r="24" fill="#55D6C3"/><circle cx="1189" cy="131" r="10" fill="#62A8E1"/>
    <circle cx="1158" cy="319" r="12" fill="#55D6C3"/><circle cx="1027" cy="339" r="14" fill="#62A8E1"/>
  </g>
  <circle cx="1080" cy="197" r="43" stroke="#55D6C3" stroke-opacity=".18" stroke-width="12" fill="none"/>
</svg>
